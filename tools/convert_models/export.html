<!doctype html><html><body>
<script type="importmap">{"imports":{"three":"./package/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { ColladaLoader } from './package/examples/jsm/loaders/ColladaLoader.js';
import { mergeVertices } from './package/examples/jsm/utils/BufferGeometryUtils.js';
const b64 = (ta) => { const u = new Uint8Array(ta.buffer, ta.byteOffset, ta.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
async function exportModel(file, sidUrl, opts) {
  const sid = await (await fetch(sidUrl)).json();
  const c = await new Promise((res) => new ColladaLoader().load(file, res));
  await new Promise((r) => setTimeout(r, 2500));   // let textures load
  const root = c.scene;
  root.traverse(o => { if (sid[o.name]) o.name = sid[o.name]; });
  root.updateMatrixWorld(true);
  // node hierarchy (everything that isn't a mesh)
  const nodes = [], index = new Map();
  root.traverse(o => {
    if (o.isMesh || o.isLight || o.isCamera) return;
    index.set(o, nodes.length);
    nodes.push({ n: o.name, p: o.parent && index.has(o.parent) ? index.get(o.parent) : -1, b: o.isBone ? 1 : 0,
      t: o.position.toArray().map(v => +v.toFixed(5)), q: o.quaternion.toArray().map(v => +v.toFixed(6)), s: o.scale.toArray().map(v => +v.toFixed(5)) });
  });
  const meshes = [];
  const texs = {};
  root.traverse(o => {
    if (!o.isMesh) return;
    let g = o.geometry.clone();
    const before = g.attributes.position.count;
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'skinIndex', 'skinWeight'].includes(k)) g.deleteAttribute(k);
    g = mergeVertices(g, 1e-5);
    const at = {};
    for (const [k, a] of Object.entries(g.attributes)) {
      let arr = a.array;
      if (k === 'skinIndex') arr = Uint8Array.from(arr);
      else if (k === 'skinWeight') arr = Uint8Array.from(arr, v => Math.round(v * 255));
      else arr = Float32Array.from(arr);
      at[k] = { d: b64(arr), n: a.itemSize, t: arr.constructor.name };
    }
    const idx = g.index.count > 65535 ? Uint32Array.from(g.index.array) : Uint16Array.from(g.index.array);
    const mats = (Array.isArray(o.material) ? o.material : [o.material]).map(m => {
      let map = null;
      if (m.map && m.map.image) { map = m.map.image.src.split('/').pop(); texs[map] = 1; }
      return { name: m.name, color: m.color.getHex(), map };
    });
    meshes.push({ name: o.name, parent: index.get(o.parent), skinned: !!o.isSkinnedMesh, groups: g.groups.map(x => [x.start, x.count, x.materialIndex]),
      index: { d: b64(idx), t: idx.constructor.name }, attrs: at, mats,
      bones: o.isSkinnedMesh ? o.skeleton.bones.map(b => b.name) : null,
      inverses: o.isSkinnedMesh ? b64(Float32Array.from(o.skeleton.boneInverses.flatMap(m => m.elements))) : null,
      bindMatrix: o.isSkinnedMesh ? o.bindMatrix.elements.map(v => +v.toFixed(6)) : null,
      local: o.matrix.elements.map(v => +v.toFixed(6)), verts: [before, g.attributes.position.count] });
  });
  return { nodes, meshes, textures: Object.keys(texs) };
}
window.go = async () => {
  const sonic = await exportModel('sonic.dae', 'sidmap.json');
  const pawn = await exportModel('pawn.dae', 'sidmap_pawn.json');
  // clips
  const anims = await (await fetch('anims.json')).json();
  const D = Math.PI / 180, clips = {};
  const want = { run: 'sonic_running', sprint: 'sonic_sprinting_max', idle: 'sonic_idle', hit: 'sonic_is_hit', spring: 'sonic_springing', fall: 'sonic_free_falling', drift: 'sonic_drift', win: 'sonic_victory', homing: 'sonic_air_strike_attack', kick: 'sonic_fall_kick' };
  for (const [key, name] of Object.entries(want)) {
    const A = anims[name], tracks = [];
    for (const t of A.tracks) {
      const n = t.times.length, v = [];
      if (t.kind === 'euler') {
        for (let i = 0; i < n; i++) {
          const e = t.values.slice(i * 3, i * 3 + 3);
          const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(e[0] * D, e[1] * D, e[2] * D, 'YXZ'));
          v.push(+q.x.toFixed(4), +(-q.y).toFixed(4), +(-q.z).toFixed(4), +q.w.toFixed(4));
        }
        tracks.push([t.bone + '.quaternion', t.times, v]);
      } else if (t.kind === 'pos') {
        for (let i = 0; i < n; i++) v.push(+(-t.values[i * 3]).toFixed(4), +t.values[i * 3 + 1].toFixed(4), +t.values[i * 3 + 2].toFixed(4));
        tracks.push([t.bone + '.position', t.times, v]);
      }
    }
    clips[key] = { d: A.duration, tracks };
  }
  sonic.clips = clips;
  window.result = { sonic, pawn };
  return true;
};
window.ready = true;
</script></body></html>
