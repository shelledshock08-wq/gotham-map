<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Red Riding Hood · Model Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #16171a; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 10px; top: 10px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; }
  #ui select, #ui button { font: inherit; }
  .lbl { position: fixed; bottom: 8px; color: #aaa; font-size: 12px; transform: translateX(-50%); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<div id="ui"><select id="clip"></select> <button id="pause">pause</button> <span id="info"></span></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ?model=assets/models/jason.glb&clip=Walk&t=0.3&views=front,side,back&still=1
const q = new URLSearchParams(location.search);
const modelUrl = q.get('model') || 'assets/models/jason.glb';
const views = (q.get('views') || 'orbit').split(',');
const still = q.has('still');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2c31);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xfff1e0, 2.6);
key.position.set(2.5, 4, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 0.5, far: 12 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0xb8cfff, 1.6); rim.position.set(-3, 3, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: 0x3a3b40, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
cam.position.set(0, 1.2, 5.2);
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(0, 1.0, 0);

const VIEW = { front: [0, 0], side: [Math.PI / 2, 0], back: [Math.PI, 0], three: [0.6, 0], left: [-Math.PI / 2, 0], face: [0.35, 1] };
let mixer, actions = {}, current, clock = new THREE.Clock(), paused = still, model;
new GLTFLoader().load(modelUrl, (g) => {
  model = g.scene;
  model.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  scene.add(model);
  mixer = new THREE.AnimationMixer(model);
  const sel = document.getElementById('clip');
  sel.add(new Option('(rest pose)', ''));
  for (const c of g.animations) { actions[c.name] = mixer.clipAction(c); sel.add(new Option(c.name, c.name)); }
  sel.onchange = () => play(sel.value);
  const clip = q.get('clip') ?? 'Idle_A';
  sel.value = clip; play(clip);
  if (still && current) { const d = current.getClip().duration; mixer.setTime(parseFloat(q.get('t') || '0') * d); }
  document.getElementById('info').textContent = `${g.animations.length} clips`;
  window.__ready = true;
});
function play(name) {
  if (current) current.stop();
  current = actions[name];
  if (current) current.play();
}
document.getElementById('pause').onclick = () => (paused = !paused);

function render() {
  requestAnimationFrame(render);
  const dt = clock.getDelta();
  if (mixer && !paused) mixer.update(dt);
  const W = innerWidth, H = innerHeight;
  if (views[0] === 'orbit') {
    cam.aspect = W / H; cam.updateProjectionMatrix(); controls.update();
    renderer.setViewport(0, 0, W, H); renderer.setScissorTest(false); renderer.render(scene, cam);
    return;
  }
  renderer.setScissorTest(true);
  const w = W / views.length;
  views.forEach((v, i) => {
    const [yaw, close] = VIEW[v] || VIEW.front;
    const r = close ? 1.3 : 5.4, y = close ? 1.62 : 1.0;
    cam.position.set(Math.sin(yaw) * r, close ? 1.66 : 1.1, Math.cos(yaw) * r);
    cam.lookAt(0, y, 0); cam.aspect = w / H; cam.updateProjectionMatrix();
    renderer.setViewport(i * w, 0, w, H); renderer.setScissor(i * w, 0, w, H);
    renderer.render(scene, cam);
  });
}
render();
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
</script>
</body>
</html>
