name: Charmcaster Lens (Windows exe)

on:
  push:
    paths:
      - 'charmcaster/**'
      - '.github/workflows/charmcaster-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: charmcaster/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node fetch-assets.mjs
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CharmcasterLens
          path: charmcaster/desktop/dist/CharmcasterLens-Setup.exe
      - name: Attach to the charmcaster-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download CharmcasterLens-Setup.exe and double-click it: it installs in a few seconds (no admin rights needed), adds a desktop shortcut and opens the lens. If the window stays dark, wait 20 seconds for the safe graphics prompt or press F9. Built from $GITHUB_SHA."
          gh release view charmcaster-latest >/dev/null 2>&1 || \
            gh release create charmcaster-latest --target "$GITHUB_SHA" --title "Charmcaster Lens for Windows" --notes "$NOTES"
          gh release edit charmcaster-latest --notes "$NOTES"
          gh release upload charmcaster-latest dist/CharmcasterLens-Setup.exe --clobber
          # the old portable build showed a black window on some GPUs; don't leave it around
          gh release delete-asset charmcaster-latest CharmcasterLens.exe --yes || true
